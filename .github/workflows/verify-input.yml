name: Verify embedded keyboard input
on:
  push:
    branches: [fixed-workspace]
    paths: ['extension/**', 'tests/input*', 'tests/native-workspace-smoke.cjs', '.github/workflows/verify-input.yml']
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - run: npm ci
      - run: npm install --no-save electron@44.9.1
      - run: npm test
      - name: Test OS keyboard in two Signal processes, default Signal and WhatsApp view
        run: node node_modules/electron/cli.js tests/native-workspace-smoke.cjs
